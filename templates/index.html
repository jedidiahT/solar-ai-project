<!DOCTYPE html>
<html>
<head> 
<title>SOLAR AI DIAGNOSTICS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 480px;
        margin: 0 auto;
        padding: 16px;
    }
    label {
        display: block;
        margin-top: 12px;
        font-weight: bold;
    }
    input, select {
        width: 100%;
        padding: 8px;
        font-size: 16px;
        box-sizing: border-box;
    }
    button {
        width: 100%;
        margin-top: 20px;
        padding: 12px;
        font-size: 16px;
        font-weight: bold;
        background-color: #f5a623;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer
    }

    #result {
        margin-top: 20px;
        padding: 12px;
        background-color: #f4f4f4;
        border-left: 4px solid #f5a623
    }
    #result:empty {
        display: none
    }
</style>
</head>
<body>
    <h1>THE ENGINEER'S DIAGNOSTICS SYSTEM</h1>

    <label>Client name</label>
    <input id="client_name" type="text">

    <label>Number of panels</label>
    <input id="panels" type="number">

    <label>Panel wattage (W)</label>
    <input id="wattage" type="number">

    <label>Battery Voltage (V)</label>
    <input id="battery_voltage" type="number" step="0.1">

    <label>System Voltage (V)</label>
    <select id="system_voltage">
        <option value="12">12V</option>
        <option value="24">24V</option>
        <option value="48" selected>48V</option>
        <option value="96">96V</option>
    </select>

    <button onclick="getDiagnosis()">GET DIAGNOSIS</button>
    <div id="result"></div>

    <script>
        async function getDiagnosis() {
            const clientName = document.getElementById("client_name").value; 
            document.getElementById("result").innerText = "Diagnosing " + clientName + "...";

            const jobCard = {
                client_name: clientName,
                panels: Number(document.getElementById("panels").value),
                wattage: Number(document.getElementById("wattage").value),
                battery_voltage: Number(document.getElementById("battery_voltage").value),
                system_voltage: Number(document.getElementById("system_voltage").value)

            };

            const response = await fetch("/diagnose", {
                method: "POST",
                headers: {"Content-Type": "application/json" },
                body: JSON.stringify(jobCard)
            });

            const report = await response.json();

            document.getElementById("result").innerText = 
            "Client: " + report.client + "\n" +
            "Total wattage: " + report.total_wattage + "W\n" + 
            "Diagnosis: " + report.diagnosis + "\n" +
            "System voltage: " + report.system_voltage + "V\n" + 
            "AI diagnosis: " + report.ai_diagnosis;
        }
    </script>
</body> 
</html>
